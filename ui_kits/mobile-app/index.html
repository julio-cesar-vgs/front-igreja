<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Mobile App" name="Mobile App — Interactive Prototype" subtitle="Login → Dashboard → Cultos / Membros / Financeiro — click-through" viewport="460x760" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igreja Ipiranga — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: linear-gradient(135deg, color-mix(in oklch, var(--primary) 10%, var(--background)), color-mix(in oklch, var(--accent) 10%, var(--background))); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; font-family: var(--font-sans); }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .kit-caption { text-align: center; color: var(--foreground); max-width: 380px; }
  .kit-caption h1 { font-size: 17px; font-weight: 700; margin: 0; }
  .kit-caption p { font-size: 12.5px; color: var(--muted-foreground); margin: 4px 0 0; }
  #root { filter: drop-shadow(0 30px 60px rgba(15,23,42,.25)); }
</style>
</head>
<body>
  <div class="stage">
    <div id="root"></div>
    <div class="kit-caption">
      <h1>Igreja Ipiranga · Sistema de Gestão</h1>
      <p>Protótipo interativo (V2). Use "Ver como" acima para alternar permissões. Login: admin@igreja.com / qualquer senha 6+.</p>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script type="text/babel" src="kit-data.jsx?v=10"></script>
  <script type="text/babel" src="kit-ui.jsx?v=10"></script>
  <script type="text/babel" src="kit-screens-a.jsx?v=11"></script>
  <script type="text/babel" src="kit-screens-b.jsx?v=10"></script>
  <script type="text/babel" src="kit-modals.jsx?v=10"></script>
  <script type="text/babel" src="kit-forms.jsx?v=10"></script>
  <script type="text/babel" src="kit-forms-culto.jsx?v=10"></script>
  <script type="text/babel" src="kit-forms-membro.jsx?v=10"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function ListSkeleton() {
      return (
        <div className="screen has-nav">
          <div className="hdr-primary flat"><Skeleton h={26} w="55%" style={{ background: "rgba(255,255,255,.25)" }} /></div>
          <div className="list">
            {[0,1,2,3].map((i) => (
              <div className="card" key={i}>
                <Skeleton h={14} w="40%" /><Skeleton h={18} w="75%" style={{ marginTop: 10 }} /><Skeleton h={12} w="55%" style={{ marginTop: 10 }} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      // URL params: ?role=ADMIN&screen=dashboard&embed=1
      const params = new URLSearchParams(window.location.search);
      const initRole = params.get('role') || 'ADMIN';
      const initScreen = params.get('screen') || 'login';
      const initTab = params.get('tab') || 'resumo';
      const embedded = params.get('embed') === '1';

      const [role, setRole] = useState(initRole);
      const [screen, setScreen] = useState(initScreen === 'login' ? 'login' : initScreen);
      const [cultoId, setCultoId] = useState("1");
      const [membroId, setMembroId] = useState(1);
      const [modal, setModal] = useState(null);
      const [subType, setSubType] = useState(null); // louvor|musico|cooperador|presbitero|visitante
      const [cultos, setCultos] = useState(() => makeCultos());
      const [membros, setMembros] = useState(() => [...MEMBROS]);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(false);

      // format BRL without React dependency
      function brlStr(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        clearTimeout(window.__t);
        window.__t = setTimeout(() => setToast(null), 2600);
      };

      // skeleton on entering list screens
      const enter = (s) => {
        if (["cultos", "membros", "financeiro", "relatorios"].includes(s)) {
          setLoading(true); setScreen(s);
          clearTimeout(window.__l);
          window.__l = setTimeout(() => setLoading(false), 480);
        } else { setScreen(s); }
      };

      const onTab = (t) => { enter(t === "home" ? "dashboard" : t); };
      const navTo = (s) => { enter(s); };
      // highlight derives from the current screen, so it never lags
      const screenToTab = { dashboard: "home", cultos: "cultos", culto: "cultos", membros: "membros", membro: "membros", financeiro: "financeiro", relatorios: "relatorios", auditoria: "relatorios" };
      const activeTab = screenToTab[screen] || "home";
      const openCulto = (id) => { setCultoId(id); setScreen("culto"); };
      const openMembro = (id) => { setMembroId(id); setScreen("membro"); };

      const culto = cultos.find((c) => c.id === cultoId) || cultos[0];
      const membro = membros.find((m) => m.id === membroId) || membros[0];

      const confirmConferencia = (result) => {
        // NÃO altera o status do culto — a conferência bloqueia edições
        // mas não é sinônimo de «finalizar». Fechar o culto é uma ação separada
        // (editar status para FINALIZADO via CultoFormModal).
        setCultos((cs) => cs.map((c) =>
          c.id === cultoId ? { ...c, conferencia: { ...result, data: "01/06/2026" } } : c
        ));
        setModal(null);
        const msg = result.status === "CONFERIDO"
          ? "Conferência realizada! Valores conferem."
          : `Conferência salva com divergência de ${brlStr(Math.abs(result.diferenca))}.`;
        showToast(msg, result.status === "CONFERIDO" ? "success" : "warning");
      };
      const confirmReabrir = () => {
        setCultos((cs) => cs.map((c) => c.id === cultoId ? { ...c, status: "EM_ANDAMENTO", conferencia: null } : c));
        setModal(null);
        showToast("Culto reaberto com sucesso", "success");
      };
      const saveDizimo = (entry) => {
        setCultos((cs) => cs.map((c) => c.id === cultoId ? { ...c, dizimos: [entry, ...c.dizimos] } : c));
        setModal(null);
        showToast("Dízimo registrado com sucesso", "success");
      };
      const saveOferta = (entry) => {
        setCultos((cs) => cs.map((c) => c.id === cultoId ? { ...c, ofertas: [entry, ...c.ofertas] } : c));
        setModal(null);
        showToast("Oferta registrada com sucesso", "success");
      };
      const registrarDizimoQuick = () => {
        const em = cultos.find((c) => c.status === "EM_ANDAMENTO" && !c.conferencia) || cultos[0];
        setCultoId(em.id); setModal("add-dizimo");
      };
      const createCulto = (data) => {
        const id = "n" + Date.now();
        setCultos((cs) => [{ id, ...data, louvores: [], musicos: [], cooperadores: [], presbiteros: [], visitantes: [], dizimos: [], ofertas: [], conferencia: null }, ...cs]);
        setModal(null); enter("cultos");
        showToast("Culto criado com sucesso!", "success");
      };
      const editCulto = (data) => {
        setCultos((cs) => cs.map((c) => c.id === cultoId ? { ...c, ...data } : c));
        setModal(null);
        showToast("Culto atualizado com sucesso!", "success");
      };
      const deleteCulto = () => {
        setCultos((cs) => cs.filter((c) => c.id !== cultoId));
        setModal(null); enter("cultos");
        showToast("Culto removido.", "success");
      };
      const addSub = (type) => { setSubType(type); setModal("sub"); };
      const saveSub = (vals) => {
        setCultos((cs) => cs.map((c) => {
          if (c.id !== cultoId) return c;
          const key = { louvor: "louvores", musico: "musicos", cooperador: "cooperadores", presbitero: "presbiteros", visitante: "visitantes" }[subType];
          const item = subType === "louvor" ? { nome: vals.pessoaNome, hino: vals.hinoOpcional || "—" }
            : subType === "cooperador" ? { nome: vals.nome, cargo: vals.cargo || "—" }
            : { nome: vals.nome, tel: vals.telefone || "" };
          return { ...c, [key]: [...c[key], item] };
        }));
        setModal(null);
        const msgs = { louvor: "Louvor adicionado!", musico: "Músico adicionado!", cooperador: "Cooperador adicionado!", presbitero: "Presbítero adicionado!", visitante: "Visitante registrado!" };
        showToast(msgs[subType] || "Adicionado!", "success");
      };
      // Edit/Delete dízimo
      const [editDizimoIdx, setEditDizimoIdx] = React.useState(null);
      const [editOfertaIdx, setEditOfertaIdx] = React.useState(null);

      const openEditDizimo = (i) => { setEditDizimoIdx(i); setModal("edit-dizimo"); };
      const openDeleteDizimo = (i) => { setEditDizimoIdx(i); setModal("del-dizimo"); };
      const openEditOferta = (i) => { setEditOfertaIdx(i); setModal("edit-oferta"); };
      const openDeleteOferta = (i) => { setEditOfertaIdx(i); setModal("del-oferta"); };

      const saveDizimoEdit = (entry) => {
        setCultos((cs) => cs.map((c) => {
          if (c.id !== cultoId) return c;
          const newDiz = [...c.dizimos]; newDiz[editDizimoIdx] = entry; return { ...c, dizimos: newDiz };
        })); setModal(null); showToast("Dízimo atualizado!", "success");
      };
      const deleteDizimo = () => {
        setCultos((cs) => cs.map((c) => {
          if (c.id !== cultoId) return c;
          return { ...c, dizimos: c.dizimos.filter((_, i) => i !== editDizimoIdx) };
        })); setModal(null); showToast("Dízimo removido.", "success");
      };
      const saveOfertaEdit = (entry) => {
        setCultos((cs) => cs.map((c) => {
          if (c.id !== cultoId) return c;
          const newOf = [...c.ofertas]; newOf[editOfertaIdx] = entry; return { ...c, ofertas: newOf };
        })); setModal(null); showToast("Oferta atualizada!", "success");
      };
      const deleteOferta = () => {
        setCultos((cs) => cs.map((c) => {
          if (c.id !== cultoId) return c;
          return { ...c, ofertas: c.ofertas.filter((_, i) => i !== editOfertaIdx) };
        })); setModal(null); showToast("Oferta removida.", "success");
      };
      const novoMembro = (data) => { setMembros((ms) => [data, ...ms]); setModal(null); showToast("Membro cadastrado com sucesso!", "success"); };
      const editMembro = (data) => { setMembros((ms) => ms.map((m) => m.id === membroId ? { ...m, ...data } : m)); setModal(null); showToast("Dados do membro atualizados!", "success"); };
      const deleteMembro = () => { setMembros((ms) => ms.filter((m) => m.id !== membroId)); setModal(null); enter("membros"); showToast("Membro removido.", "success"); };
      const alterarStatus = (status) => { setMembros((ms) => ms.map((m) => m.id === membroId ? { ...m, status } : m)); setModal(null); showToast("Status atualizado para " + status + ".", "success"); };

      const SCREENS = {
        login: <LoginScreen onLogin={() => { enter("dashboard"); }} />,
        dashboard: <DashboardScreen role={role} cultos={cultos} onNavigate={navTo} onOpenCulto={openCulto} onRegistrarDizimo={registrarDizimoQuick} onToast={showToast} />,
        cultos: <CultosScreen role={role} cultos={cultos} onOpenCulto={openCulto} onNovoCulto={() => setModal("novo")} />,
        culto: <CultoDetalheScreen role={role} culto={culto} defaultTab={initTab} onBack={() => enter("cultos")} onConferir={() => setModal("conferencia")} onReabrir={() => setModal("reabrir")} onAddDizimo={() => setModal("add-dizimo")} onAddOferta={() => setModal("add-oferta")} onEditDizimo={openEditDizimo} onDeleteDizimo={openDeleteDizimo} onEditOferta={openEditOferta} onDeleteOferta={openDeleteOferta} onEditCulto={() => setModal("edit-culto")} onDeleteCulto={() => setModal("del-culto")} onAddSub={addSub} onToast={showToast} />,
        membros: <MembrosScreen role={role} membros={membros} onOpenMembro={openMembro} onNovoMembro={() => setModal("novo-membro")} onToast={showToast} />,
        membro: <MembroDetalheScreen role={role} membro={membro} onBack={() => enter("membros")} onEdit={() => setModal("edit-membro")} onDelete={() => setModal("del-membro")} onAlterarStatus={() => setModal("alt-status")} onToast={showToast} />,
        financeiro: <FinanceiroScreen cultos={cultos} onNavigate={navTo} onOpenCulto={openCulto} onToast={showToast} />,
        relatorios: <RelatoriosScreen role={role} cultos={cultos} onOpenCulto={openCulto} onNavigate={navTo} />,
        auditoria: <AuditoriaScreen onBack={() => enter("relatorios")} />,
      };

      const showNav = ["dashboard", "cultos", "membros", "financeiro", "relatorios"].includes(screen);
      const body = loading && ["cultos","membros","financeiro","relatorios"].includes(screen) ? <ListSkeleton /> : SCREENS[screen];

      return (
        <>
          {!embedded && screen !== "login" && <RoleBar role={role} onChange={setRole} />}
          <PhoneFrame>
            {body}
            {showNav && <BottomNavigation active={activeTab} onChange={onTab} />}
            {modal === "conferencia" && <ConferenciaModal culto={culto} onClose={() => setModal(null)} onConfirm={confirmConferencia} />}
            {modal === "reabrir" && culto.conferencia && <ReaberturaModal culto={culto} onClose={() => setModal(null)} onConfirm={confirmReabrir} />}
            {modal === "novo" && <CultoFormModal onClose={() => setModal(null)} onSave={createCulto} />}
            {modal === "edit-culto" && <CultoFormModal culto={culto} onClose={() => setModal(null)} onSave={editCulto} />}
            {modal === "del-culto" && <ConfirmarExcluirModal titulo="Excluir Culto" descricao={`"${culto.tema}" e todos os seus registros serão permanentemente removidos. Esta ação não pode ser desfeita.`} onClose={() => setModal(null)} onConfirm={deleteCulto} />}
            {modal === "sub" && <SubEntityModalWrapper type={subType} locked={!!culto.conferencia} onClose={() => setModal(null)} onSave={saveSub} />}
            {modal === "add-dizimo" && <RegistrarDizimoModal onClose={() => setModal(null)} onSave={saveDizimo} />}
            {modal === "add-oferta" && <RegistrarOfertaModal onClose={() => setModal(null)} onSave={saveOferta} />}
            {modal === "novo-membro" && <MembroFormModal onClose={() => setModal(null)} onSave={novoMembro} />}
            {modal === "edit-membro" && <MembroFormModal membro={membro} onClose={() => setModal(null)} onSave={editMembro} />}
            {modal === "del-membro" && <ConfirmarExcluirModal titulo="Excluir Membro" descricao={`"${membro.nome}" será removido permanentemente. Esta ação não pode ser desfeita.`} onClose={() => setModal(null)} onConfirm={deleteMembro} />}
            {modal === "alt-status" && <AlterarStatusModal membro={membro} onClose={() => setModal(null)} onSave={alterarStatus} />}
            {modal === "edit-dizimo" && editDizimoIdx !== null && <RegistrarDizimoModal item={culto.dizimos[editDizimoIdx]} onClose={() => setModal(null)} onSave={saveDizimoEdit} />}
            {modal === "del-dizimo" && editDizimoIdx !== null && <ConfirmarExcluirModal titulo="Remover Dízimo" descricao={`Dízimo de "${culto.dizimos[editDizimoIdx]?.membro}" (${brlStr(culto.dizimos[editDizimoIdx]?.valor || 0)}) será removido.`} label="Remover" onClose={() => setModal(null)} onConfirm={deleteDizimo} />}
            {modal === "edit-oferta" && editOfertaIdx !== null && <RegistrarOfertaModal item={culto.ofertas[editOfertaIdx]} onClose={() => setModal(null)} onSave={saveOfertaEdit} />}
            {modal === "del-oferta" && editOfertaIdx !== null && <ConfirmarExcluirModal titulo="Remover Oferta" descricao={`Oferta ${culto.ofertas[editOfertaIdx]?.tipo} (${brlStr(culto.ofertas[editOfertaIdx]?.valor || 0)}) será removida.`} label="Remover" onClose={() => setModal(null)} onConfirm={deleteOferta} />}
            {modal === "sessao" && <SessaoExpiradaModal onLogin={() => { setModal(null); setScreen("login"); }} />}
            <Toast toast={toast} />
          </PhoneFrame>
        </>
      );
    }

    // RoleBar must render in the stage above the phone — mount separately, synced via a shared store.
    function Root() {
      return <App />;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
