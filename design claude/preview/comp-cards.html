<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .ico i{width:20px;height:20px}
  .num{font-size:26px;font-weight:700;line-height:1}
  .sub{font-size:13px;color:var(--muted-foreground);margin-top:4px}
</style>
</head><body>
<div class="grid">
  <div class="card">
    <div class="ico" style="background:color-mix(in oklch,var(--primary) 12%,transparent)"><i data-lucide="users" style="color:var(--primary)"></i></div>
    <div class="num">156</div><div class="sub">Membros Ativos</div>
  </div>
  <div class="card">
    <div class="ico" style="background:color-mix(in oklch,var(--chart-2) 20%,transparent)"><i data-lucide="wallet" style="color:var(--chart-2)"></i></div>
    <div class="num">R$ 12.450</div><div class="sub">Este Mês</div>
  </div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--muted-foreground)">Metric card: tinted rounded icon chip, big number, muted caption. White surface, 1px border, soft shadow, radius-lg.</p>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
