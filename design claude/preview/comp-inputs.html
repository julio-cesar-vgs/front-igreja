<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .field{position:relative;margin-bottom:12px}
  .lbl{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
  .inp{width:100%;height:52px;border-radius:14px;border:1px solid var(--input);background:var(--card);padding:0 16px;font-size:17px;font-family:var(--font-sans);color:var(--foreground)}
  .inp::placeholder{color:var(--muted-foreground)}
  .inp.icon{padding-left:44px}
  .inp.err{border-color:var(--destructive)}
  .field i{position:absolute;left:14px;top:42px;width:18px;height:18px;color:var(--muted-foreground)}
  .msg{font-size:13px;color:var(--destructive);font-weight:500;margin-top:5px}
</style>
</head><body>
<div class="field">
  <label class="lbl">E-mail</label>
  <i data-lucide="search"></i>
  <input class="inp icon" placeholder="seu@email.com">
</div>
<div class="field">
  <label class="lbl">Senha</label>
  <input class="inp err" type="password" value="123" style="-webkit-text-security:disc">
  <div class="msg">Senha deve ter pelo menos 6 caracteres</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
