<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .alert{display:flex;gap:12px;align-items:flex-start;border-radius:14px;border:1px solid;padding:14px}
  .ok{background:color-mix(in oklch,var(--success) 10%,transparent);border-color:var(--success)}
  .warn{background:color-mix(in oklch,var(--warning) 10%,transparent);border-color:var(--warning);margin-top:12px}
  .alert i{width:20px;height:20px;flex-shrink:0;margin-top:1px}
  .t{font-weight:600;font-size:15px}
  .d{font-size:13px;color:var(--muted-foreground);margin-top:2px}
</style>
</head><body>
<div class="alert ok">
  <i data-lucide="check-circle-2" style="color:var(--success)"></i>
  <div><div class="t" style="color:var(--success)">Conferência OK</div><div class="d">Os valores conferem perfeitamente.</div></div>
</div>
<div class="alert warn">
  <i data-lucide="alert-circle" style="color:var(--warning)"></i>
  <div><div class="t" style="color:var(--warning)">Divergência Detectada</div><div class="d">Diferença de R$ 45,00</div></div>
</div>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
