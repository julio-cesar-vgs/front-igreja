<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .icons{display:grid;grid-template-columns:repeat(9,1fr);gap:16px}
  .icons i{width:24px;height:24px;color:var(--foreground);stroke-width:2}
  .ic{display:flex;flex-direction:column;align-items:center;gap:5px}
  .ic span{font-size:9px;color:var(--muted-foreground);font-family:var(--font-mono)}
</style>
</head><body>
<div class="icons">
  <div class="ic"><i data-lucide="church"></i><span>church</span></div>
  <div class="ic"><i data-lucide="home"></i><span>home</span></div>
  <div class="ic"><i data-lucide="users"></i><span>users</span></div>
  <div class="ic"><i data-lucide="wallet"></i><span>wallet</span></div>
  <div class="ic"><i data-lucide="dollar-sign"></i><span>dollar</span></div>
  <div class="ic"><i data-lucide="gift"></i><span>gift</span></div>
  <div class="ic"><i data-lucide="music"></i><span>music</span></div>
  <div class="ic"><i data-lucide="heart"></i><span>heart</span></div>
  <div class="ic"><i data-lucide="calendar"></i><span>calendar</span></div>
  <div class="ic"><i data-lucide="trending-up"></i><span>trend</span></div>
  <div class="ic"><i data-lucide="search"></i><span>search</span></div>
  <div class="ic"><i data-lucide="plus"></i><span>plus</span></div>
  <div class="ic"><i data-lucide="bell"></i><span>bell</span></div>
  <div class="ic"><i data-lucide="eye"></i><span>eye</span></div>
  <div class="ic"><i data-lucide="check-circle-2"></i><span>check</span></div>
  <div class="ic"><i data-lucide="alert-circle"></i><span>alert</span></div>
  <div class="ic"><i data-lucide="chevron-right"></i><span>chevron</span></div>
  <div class="ic"><i data-lucide="phone"></i><span>phone</span></div>
</div>
<p style="margin:16px 0 0;font-size:12px;color:var(--muted-foreground)">Lucide React throughout — 24px, 2px stroke, no fills (except the dizimista heart). No emoji, no PNG icons. Consistent rounded line set.</p>
<script src="https://unpkg.com/lucide@latest"></script><script>lucide.createIcons();</script>
</body></html>
