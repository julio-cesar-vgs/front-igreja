<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Sidebar Chrome" subtitle="Deep navy desktop sidebar tokens" viewport="700x175" -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body{background:var(--sidebar);color:var(--sidebar-foreground);}
  .swatch-grid{grid-template-columns:repeat(4,1fr);} .swatch{height:46px;border-color:rgba(255,255,255,.12);}
  .tok-name{color:var(--sidebar-foreground)}
</style>
</head><body>
<div class="swatch-grid">
  <div class="col"><div class="swatch" style="background:var(--sidebar)"></div><div class="tok-name">sidebar</div></div>
  <div class="col"><div class="swatch" style="background:var(--sidebar-primary)"></div><div class="tok-name">primary</div></div>
  <div class="col"><div class="swatch" style="background:var(--sidebar-accent)"></div><div class="tok-name">accent</div></div>
  <div class="col"><div class="swatch" style="background:var(--sidebar-border)"></div><div class="tok-name">border</div></div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--sidebar-foreground);opacity:.7">Deep navy chrome for the desktop sidebar — a darker shade of the brand blue, present in both light and dark themes.</p>
</body></html>
