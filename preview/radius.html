<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.r{display:flex;gap:14px;align-items:flex-end}
.box{background:var(--secondary);border:1px solid var(--border);width:88px;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;color:var(--muted-foreground);font-family:var(--font-mono)}</style>
</head><body>
<div class="r">
  <div class="box" style="border-radius:12px">sm 12</div>
  <div class="box" style="border-radius:14px">md 14</div>
  <div class="box" style="border-radius:16px">lg 16</div>
  <div class="box" style="border-radius:20px">xl 20</div>
  <div class="box" style="border-radius:9999px">full</div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted-foreground)">Base <code style="font-family:var(--font-mono)">--radius: 1rem</code> — soft &amp; approachable. Pills, avatars &amp; the FAB use full; the phone bezel is rounded-[3rem].</p>
</body></html>
