<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success / Warning / Destructive" viewport="700x185" -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.swatch-grid{grid-template-columns:repeat(3,1fr);}</style>
</head><body>
<div class="swatch-grid">
  <div class="col">
    <div class="swatch" style="background:var(--success)"></div>
    <div class="tok-name" style="color:var(--success)">Success</div>
    <div class="tok-val">#22c55e · dízimos</div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--warning)"></div>
    <div class="tok-name" style="color:var(--warning)">Warning</div>
    <div class="tok-val">#f59e0b · divergência</div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--destructive)"></div>
    <div class="tok-name" style="color:var(--destructive)">Destructive</div>
    <div class="tok-val">#ef4444 · erro</div>
  </div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted-foreground)">Universal semantics: green confirms &amp; tallies tithes, amber flags conference divergences, red for errors and deletions.</p>
</body></html>
