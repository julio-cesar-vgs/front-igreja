<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body{background:var(--background);}
  .dark-wrap{}
  .swatch-grid{grid-template-columns:repeat(5,1fr);} .swatch{height:44px;}
</style>
</head><body>
<div class="dark">
<div class="swatch-grid">
  <div class="col"><div class="swatch" style="background:var(--background)"></div><div class="tok-name" style="color:var(--foreground)">bg</div></div>
  <div class="col"><div class="swatch" style="background:var(--card)"></div><div class="tok-name" style="color:var(--foreground)">card</div></div>
  <div class="col"><div class="swatch" style="background:var(--primary)"></div><div class="tok-name" style="color:var(--foreground)">primary</div></div>
  <div class="col"><div class="swatch" style="background:var(--accent)"></div><div class="tok-name" style="color:var(--foreground)">accent</div></div>
  <div class="col"><div class="swatch" style="background:var(--success)"></div><div class="tok-name" style="color:var(--foreground)">success</div></div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted-foreground)">Dark theme (<code style="font-family:var(--font-mono)">.dark</code>): same hues lifted on a navy ground — primary brightens to stay legible. Suited to low-light sanctuaries.</p>
</div>
</body></html>
