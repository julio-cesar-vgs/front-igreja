<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base unit, generous padding" viewport="700x175" -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.r{display:flex;gap:10px;align-items:flex-end}
.u{background:var(--primary);border-radius:4px;height:22px;opacity:.85}
.lbl{font-size:10px;color:var(--muted-foreground);font-family:var(--font-mono);text-align:center;margin-top:5px}</style>
</head><body>
<div class="cap" style="margin-bottom:10px">Spacing — 4px base unit</div>
<div class="r">
  <div><div class="u" style="width:4px"></div><div class="lbl">1·4</div></div>
  <div><div class="u" style="width:8px"></div><div class="lbl">2·8</div></div>
  <div><div class="u" style="width:12px"></div><div class="lbl">3·12</div></div>
  <div><div class="u" style="width:16px"></div><div class="lbl">4·16</div></div>
  <div><div class="u" style="width:24px"></div><div class="lbl">6·24</div></div>
  <div><div class="u" style="width:32px"></div><div class="lbl">8·32</div></div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted-foreground)">Generous padding (16–24px) on primary elements; screen gutters are 24px (px-6). Touch targets ≥ 48px.</p>
</body></html>
