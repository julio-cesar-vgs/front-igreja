<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutrals & Surfaces" subtitle="Blue-tinted grays, surfaces, borders" viewport="700x195" -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.swatch-grid{grid-template-columns:repeat(5,1fr);} .swatch{height:44px;}</style>
</head><body>
<div class="swatch-grid">
  <div class="col"><div class="swatch" style="background:var(--background)"></div><div class="tok-name">background</div></div>
  <div class="col"><div class="swatch" style="background:var(--card)"></div><div class="tok-name">card</div></div>
  <div class="col"><div class="swatch" style="background:var(--secondary)"></div><div class="tok-name">secondary</div></div>
  <div class="col"><div class="swatch" style="background:var(--muted)"></div><div class="tok-name">muted</div></div>
  <div class="col"><div class="swatch" style="background:var(--border)"></div><div class="tok-name">border</div></div>
</div>
<div class="row" style="margin-top:16px;gap:18px">
  <div class="row" style="gap:7px"><span style="width:16px;height:16px;border-radius:4px;background:var(--foreground)"></span><span class="tok-val" style="color:var(--foreground)">foreground · ink</span></div>
  <div class="row" style="gap:7px"><span style="width:16px;height:16px;border-radius:4px;background:var(--muted-foreground)"></span><span class="tok-val">muted-foreground</span></div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--muted-foreground)">All neutrals carry a faint blue tint (hue 250) so surfaces feel cohesive with the brand.</p>
</body></html>
