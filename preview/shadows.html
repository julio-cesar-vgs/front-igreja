<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation / Shadows" subtitle="Soft navy shadows sm/md/lg" viewport="700x185" -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.r{display:flex;gap:24px;align-items:center;padding-top:6px}
.box{background:var(--card);border:1px solid var(--border);width:120px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)}</style>
</head><body>
<div class="r">
  <div class="box" style="box-shadow:0 1px 2px rgba(15,23,42,.06)">shadow-sm</div>
  <div class="box" style="box-shadow:0 4px 6px -1px rgba(15,23,42,.10),0 2px 4px -2px rgba(15,23,42,.08)">shadow-md</div>
  <div class="box" style="box-shadow:0 10px 15px -3px rgba(15,23,42,.12),0 4px 6px -4px rgba(15,23,42,.08)">shadow-lg</div>
</div>
<p style="margin:16px 0 0;font-size:12.5px;color:var(--muted-foreground)">Soft, low-opacity navy shadows. Cards rest at sm; finance summary cards &amp; the FAB lift to md/lg. Hover bumps a card from sm→md.</p>
</body></html>
