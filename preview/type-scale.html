<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--border)}
.r:last-child{border:0}.r .lbl{width:64px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.r .px{width:48px;font-size:11px;color:var(--muted-foreground)}</style>
</head><body>
<div class="r"><span class="lbl">4xl</span><span class="px">36</span><span style="font-size:24px;font-weight:700">Total Geral</span></div>
<div class="r"><span class="lbl">2xl</span><span class="px">24</span><span style="font-size:20px;font-weight:700">Título da Tela</span></div>
<div class="r"><span class="lbl">xl</span><span class="px">20</span><span style="font-size:18px;font-weight:600">Cabeçalho</span></div>
<div class="r"><span class="lbl">lg</span><span class="px">18</span><span style="font-size:17px;font-weight:500">Botão / Input</span></div>
<div class="r"><span class="lbl">base</span><span class="px">16</span><span style="font-size:16px">Corpo do texto</span></div>
<div class="r"><span class="lbl">sm</span><span class="px">14</span><span style="font-size:14px;color:var(--muted-foreground)">Texto auxiliar</span></div>
<div class="r"><span class="lbl">xs</span><span class="px">12</span><span style="font-size:12px;color:var(--muted-foreground)">Meta / badge</span></div>
</body></html>
